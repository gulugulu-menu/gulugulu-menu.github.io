<title>Gulu Gulu — menu i opinie</title>

<meta name="theme-color" content="#5c4029">
<style>
  :root { --brown:#5c4029; --brown-d:#3e2a18; --paper:#f7f2e7; --cream:#f2ece0;
           --muted:#6c645b; --line:#e3dccc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html,body { margin:0; padding:0 }
  body { background:var(--paper); color:#2f2820; min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; }
  .shell { width:100%; max-width:440px; margin:0 auto; flex:1; display:flex; flex-direction:column }

  header { background:var(--brown); border-radius:0 0 30px 30px; padding:34px 24px 30px;
    text-align:center; position:relative }
  header .emb { width:min(30%,120px); height:auto; display:block; margin:0 auto 14px }
  header .word { width:min(64%,250px); height:auto; display:block; margin:0 auto }
  .sub { margin-top:16px; font-size:12px; letter-spacing:3px; color:#e9dcc6; font-weight:600 }

  .lang { position:absolute; top:16px; right:16px; display:flex; align-items:center;
    background:rgba(255,255,255,.14); border-radius:999px; padding:3px }
  .lang button { font:inherit; font-size:12.5px; font-weight:700; letter-spacing:.5px;
    border:0; cursor:pointer; padding:6px 11px; border-radius:999px;
    background:transparent; color:#e9dcc6 }
  .lang button[aria-pressed="true"] { background:var(--cream); color:var(--brown-d) }

  main { padding:44px 26px 30px; flex:1; display:flex; flex-direction:column }

  a.btn { display:block; text-align:center; text-decoration:none; border-radius:999px;
    font-weight:800; letter-spacing:2.4px; transition:transform .12s ease, opacity .12s ease }
  a.btn:active { transform:scale(.977); opacity:.92 }
  .primary { background:var(--brown); color:var(--cream); padding:22px 18px; font-size:19px;
    box-shadow:0 5px 0 var(--brown-d) }
  .primary:active { box-shadow:0 2px 0 var(--brown-d) }

  hr { border:0; border-top:1px solid var(--line); margin:36px 0 26px }

  .ask { font-size:17px; font-weight:700; margin:0 0 14px }
  .ghost { border:2px solid var(--brown); color:var(--brown-d); padding:17px 18px;
    font-size:15.5px; letter-spacing:.3px; font-weight:800 }

  footer { margin-top:auto; padding-top:40px; font-size:13.5px; line-height:1.95; color:var(--muted) }
  footer a { color:var(--muted) }
  .spacer { flex:1; min-height:14px }
</style>
